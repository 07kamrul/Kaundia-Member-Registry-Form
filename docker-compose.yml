services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaundia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaundia}
      POSTGRES_DB: ${POSTGRES_DB:-kaundia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaundia}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kaundia}:${POSTGRES_PASSWORD:-kaundia}@postgres:5432/${POSTGRES_DB:-kaundia}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-to-a-long-random-secret}
      # Must point inside the backend_uploads volume or files are lost on redeploy
      STORAGE_BASE_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Kaundia Member Registry <no-reply@example.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:9091}
    ports:
      - "9090:9090"
    volumes:
      - backend_uploads:/app/uploads
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             (python -m scripts.repair_document_paths --apply || true) &&
             uvicorn app.main:app --host 0.0.0.0 --port 9090"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9091:9091"

volumes:
  postgres_data:
  backend_uploads:
