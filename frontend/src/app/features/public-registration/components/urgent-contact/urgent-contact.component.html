<div [formGroup]="form" class="card" style="overflow:hidden">
  <h2 class="section-title" style="border-radius:0;margin:0">৪. জরুরি যোগাযোগ</h2>
  <div style="padding:0.75rem">
    <div class="field">
      <label>নাম</label>
      <input type="text" formControlName="urgentContactName" />
    </div>
    <div class="field">
      <label>সম্পর্ক</label>
      <input type="text" formControlName="urgentContactRelation" />
    </div>
    <div class="field">
      <label>মোবাইল</label>
      <input type="text" formControlName="urgentContactMobile" />
    </div>
    <div class="field">
      <label>ঠিকানা</label>
      <input type="text" formControlName="urgentContactAddress" />
    </div>
  </div>
</div>
