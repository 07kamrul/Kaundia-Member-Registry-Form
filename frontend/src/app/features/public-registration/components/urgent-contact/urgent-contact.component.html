<div [formGroup]="form" class="card" style="overflow:hidden">
  <h2 class="section-title" style="border-radius:0;margin:0">৪. জরুরি যোগাযোগ</h2>
  <div style="padding:0.75rem">
    <div class="field">
      <label for="urgentContactName">নাম <span class="required">*</span></label>
      <input id="urgentContactName" type="text" formControlName="urgentContactName" />
      @if (showError('urgentContactName')) {
        <p class="field-error">নাম আবশ্যক</p>
      }
    </div>
    <div class="field">
      <label for="urgentContactRelation">সম্পর্ক</label>
      <input id="urgentContactRelation" type="text" formControlName="urgentContactRelation" />
    </div>
    <div class="field">
      <label for="urgentContactMobile">মোবাইল <span class="required">*</span></label>
      <input id="urgentContactMobile" type="text" formControlName="urgentContactMobile" />
      @if (showError('urgentContactMobile')) {
        <p class="field-error">মোবাইল আবশ্যক</p>
      } @else if (mobileInvalid()) {
        <p class="field-error">মোবাইল নম্বর সঠিক নয় (01XXXXXXXXX)</p>
      }
    </div>
    <div class="field">
      <label for="urgentContactAddress">ঠিকানা</label>
      <input id="urgentContactAddress" type="text" formControlName="urgentContactAddress" />
    </div>
  </div>
</div>
