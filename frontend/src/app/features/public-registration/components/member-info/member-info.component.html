<section [formGroup]="form">
  <h2 class="section-title">১. সদস্যের ব্যক্তিগত তথ্য</h2>
  <div class="grid-2">
    <div class="field">
      <label>পূর্ণ নাম <span class="required">*</span></label>
      <input type="text" formControlName="fullName" />
    </div>
    <div class="field">
      <label>পিতা/স্বামী <span class="required">*</span></label>
      <input type="text" formControlName="fatherOrHusband" />
    </div>
    <div class="field">
      <label>মাতা <span class="required">*</span></label>
      <input type="text" formControlName="mother" />
    </div>
    <div class="field">
      <label>জন্ম তারিখ <span class="required">*</span></label>
      <input type="date" formControlName="dob" />
    </div>
    <div class="field">
      <label>জাতীয়তা</label>
      <input type="text" formControlName="nationality" />
    </div>
    <div class="field">
      <label>পেশা</label>
      <input type="text" formControlName="occupation" />
    </div>
    <div class="field">
      <label>NID নং</label>
      <input type="text" formControlName="nid" placeholder="১০-১৭ সংখ্যা" />
    </div>
    <div class="field">
      <label>মোবাইল <span class="required">*</span></label>
      <input type="text" formControlName="mobile" placeholder="01XXXXXXXXX" />
    </div>
    <div class="field">
      <label>WhatsApp</label>
      <input type="text" formControlName="whatsapp" />
    </div>
    <div class="field">
      <label>ই-মেইল</label>
      <input type="email" formControlName="email" />
    </div>
  </div>
</section>
