<div class="modal-backdrop">
  <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmation-title" style="text-align:center">
    <div style="font-size:2.5rem;margin-bottom:0.75rem;color:var(--emerald-600,#059669)">✓</div>
    <h3 id="confirmation-title" class="modal-title">
      {{ 'registration.confirmation.title' | translate }}
    </h3>
    <p class="modal-message">
      {{ 'registration.confirmation.message' | translate }}
    </p>
    <p class="modal-message">
      {{ 'registration.confirmation.referenceLabel' | translate }} <strong>{{ submissionId }}</strong>
    </p>
    <div class="modal-actions" style="justify-content:center">
      <button type="button" class="btn btn-primary" (click)="acknowledge.emit()">
        {{ 'registration.confirmation.okButton' | translate }}
      </button>
    </div>
  </div>
</div>
