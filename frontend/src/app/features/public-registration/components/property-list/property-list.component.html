<section [formGroup]="form">
  <h2 class="section-title">{{ 'registration.stepTitles.property' | translate }}</h2>
  <div class="field" style="max-width:16rem">
    <label for="propertyCount">{{ 'registration.property.countLabel' | translate }} <span class="required">*</span></label>
    <select id="propertyCount" [value]="form.get('propertyCount')?.value" (change)="onCountChange($event)">
      <option value="">{{ 'registration.property.countSelectPlaceholder' | translate }}</option>
      @for (n of propertyCounts; track n) {
        <option [value]="n">{{ n }}</option>
      }
    </select>
  </div>

  @for (p of properties.controls; track p; let i = $index) {
    <app-property-item [property]="propertyGroup(i)" [index]="i" [submitAttempted]="submitAttempted" />
  }
</section>
