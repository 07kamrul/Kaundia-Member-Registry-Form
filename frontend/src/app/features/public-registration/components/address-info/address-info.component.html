<section [formGroup]="form">
  <h2 class="section-title">২. ঠিকানার তথ্য</h2>
  <div class="grid-2">
    <div class="field">
      <label>স্থায়ী ঠিকানা</label>
      <textarea rows="3" formControlName="permanentAddress"></textarea>
    </div>
    <div class="field">
      <label>বর্তমান ঠিকানা</label>
      <textarea rows="3" formControlName="currentAddress"></textarea>
    </div>
  </div>
</section>
