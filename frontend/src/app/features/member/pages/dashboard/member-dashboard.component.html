<div style="max-width:56rem;margin:0 auto">
  <div class="page-header">
    <div>
      <h1 class="page-title">সদস্য ড্যাশবোর্ড</h1>
      <p class="page-subtitle">আপনার প্রোফাইল ও কার্যক্রমের সারসংক্ষেপ</p>
    </div>
  </div>

  @if (loading) {
    <div class="loading-state"><span class="spinner"></span> লোড হচ্ছে...</div>
  } @else if (error) {
    <div class="error-box"><p style="margin:0">{{ error }}</p></div>
  } @else {
    <div class="summary-grid">
      @for (card of cards; track card.route) {
        <a [routerLink]="card.route" class="summary-card">
          <span class="summary-card-icon"><app-icon [name]="card.icon" [size]="22" /></span>
          <div class="summary-card-body">
            <p class="summary-card-title">{{ card.title }}</p>
            <p class="summary-card-value">{{ card.value }}</p>
            <p class="summary-card-hint">{{ card.hint }}</p>
          </div>
          <span class="summary-card-chevron"><app-icon name="chevron-right" [size]="18" /></span>
        </a>
      }
    </div>
  }
</div>
