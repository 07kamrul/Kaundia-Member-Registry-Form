<div style="max-width:24rem;margin:4rem auto" class="card">
  <div style="padding:1.5rem">
    <h1 style="text-align:center;color:#064e3b;font-size:1.25rem">পাসওয়ার্ড পরিবর্তন করুন</h1>
    @if (success) {
      <p style="color:#065f46;text-align:center">পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে।</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        @if (error) {
          <div class="error-box"><p style="margin:0;color:#b91c1c">{{ error }}</p></div>
        }
        <div class="field">
          <label>পুরনো পাসওয়ার্ড</label>
          <input type="password" formControlName="oldPassword" />
        </div>
        <div class="field">
          <label>নতুন পাসওয়ার্ড</label>
          <input type="password" formControlName="newPassword" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" [disabled]="submitting || form.invalid">
          {{ submitting ? 'সংরক্ষণ হচ্ছে...' : 'পরিবর্তন করুন' }}
        </button>
      </form>
    }
  </div>
</div>
