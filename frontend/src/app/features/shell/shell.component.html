<div class="app-shell">
  <aside class="sidebar" [class.sidebar-open]="sidebarOpen()">
    <div class="sidebar-brand">
      <span class="sidebar-brand-mark">ক</span>
      <span class="sidebar-brand-text">কাউন্দিয়া</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="sidebar-link"
          [class.sidebar-link-admin]="item.adminOnly"
          (click)="closeSidebar()"
        >
          <app-icon [name]="item.icon" [size]="19" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="sidebar-logout" (click)="logout()">
      <app-icon name="logout" [size]="19" />
      <span>লগআউট</span>
    </button>
  </aside>

  @if (sidebarOpen()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="topbar-menu-btn" (click)="toggleSidebar()" aria-label="মেনু খুলুন">
        <app-icon [name]="sidebarOpen() ? 'close' : 'menu'" [size]="22" />
      </button>
      <span class="topbar-title">কাউন্দিয়া সমবায় সমিতি</span>
    </header>

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
