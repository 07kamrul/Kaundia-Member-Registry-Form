function hasPermission(user, key){
  if(!user) return false;
  if(user.role==="SUPER_ADMIN") return true;

function statusBadge(status){
  const map = {PENDING:["বিচারাধীন","badge-pending"], APPROVED:["অনুমোদিত","badge-approved"], REJECTED:["প্রত্যাখ্যাত","badge-rejected"]};

  return `<span class="badge ${cls}">${label}</span>`;
}
function duesSummary(m){
  if(!m.installments || !m.installments.length) return "—";
  const due = m.installments.filter(i=>i.status==="DUE").length;
  if(due===0) return `<span class="badge badge-paid">সম্পূর্ণ পরিশোধিত</span>`;
  return `<span class="badge badge-due">${bn(due)} মাস বকেয়া</span>`;
}

function loginMember(){
  const id = document.getElementById('memberSelect').value;
  state.currentMemberId = id; state.memberSection="dashboard";

  state.view="member"; state.forcePwModal = !!forceIt; render();
}
function loginAdmin(){
  const email = document.getElementById('adminSelect').value;
  state.adminUser = ADMIN_USERS.find(u=>u.email===email);
  state.view="admin"; state.adminSection="pending"; render();
}

        ${textField('সম্পর্ক *','urgentContact.relation',d.urgentContact.relation)}

        ${textField('ঠিকানা','urgentContact.address',d.urgentContact.address)}
      </div>`;
    case 5: return `
      <h3 class="font-display" style="font-size:1.25rem; margin:0 0 1.2rem;">পেমেন্ট তথ্য</h3>

        ${textField('রিসিট নম্বর','payment.receiptNo',d.payment.receiptNo)}
        ${fileField('রিসিটের ছবি আপলোড করুন','payment.receiptPhotoName',d.payment.receiptPhotoName)}
      </div>`;
    case 6: return reviewStep(d);

function nomineeCard(n,i){

    <button class="btn btn-ghost btn-sm" style="position:absolute; top:.7rem; left:.7rem; color:var(--danger);" onclick="removeNominee(${i})">${icon('trash')}</button>

function reviewStep(d){
  const addr2 = d.sameAsPermanent ? "একই — স্থায়ী ঠিকানার অনুরূপ" : d.currentAddress;
  return `
  <h3 class="font-display" style="font-size:1.25rem; margin:0 0 1.2rem;">পর্যালোচনা ও নিশ্চিতকরণ</h3>
  <div style="display:flex; flex-direction:column; gap:1.1rem;">
    ${reviewBlock("ব্যক্তিগত তথ্য",[["নাম",d.name],["পিতা/স্বামী",d.fatherHusband],["মাতা",d.motherName],["জন্ম তারিখ",d.dob],["এনআইডি",d.nid],["মোবাইল",d.mobile],["ইমেইল",d.email||"—"],["পেশা",d.occupation||"—"]])}
    ${reviewBlock("ঠিকানা",[["স্থায়ী ঠিকানা",d.permanentAddress],["বর্তমান ঠিকানা",addr2]])}
    ${reviewBlock("সম্পত্তি (মোট "+bn(d.properties.length)+"টি)", d.properties.map((p,i)=>[`সম্পত্তি ${bn(i+1)}`, `${p.type} — খতিয়ান ${p.khatian}, ${p.quantity}`]))}
    ${reviewBlock("মনোনীত ব্যক্তি", d.nominees.map(n=>[n.name||"—", `${n.relation} · ${n.mobile}`]))}
    ${reviewBlock("জরুরি যোগাযোগ",[["নাম",d.urgentContact.name],["সম্পর্ক",d.urgentContact.relation],["মোবাইল",d.urgentContact.mobile]])}
    ${reviewBlock("পেমেন্ট তথ্য",[["ভর্তি ফি","৳ "+d.payment.admissionFee],["মাসিক চাঁদা","৳ "+d.payment.subscription],["পদ্ধতি",d.payment.method],["রিসিট নম্বর",d.payment.receiptNo||"—"]])}
  </div>
  <label style="display:flex; gap:.6rem; align-items:flex-start; margin-top:1.3rem; font-size:.88rem; color:var(--ink-soft);">
    <input type="checkbox" id="confirmTruth" style="margin-top:.25rem;"> আমি নিশ্চিত করছি যে উপরোক্ত তথ্য সত্য ও সঠিক।
  </label>`;
}
function reviewBlock(title, rows){
  return `<div class="surface2" style="border-radius:var(--radius-md); padding:1rem 1.1rem;">
    <div style="font-weight:700; font-size:.9rem; margin-bottom:.55rem; color:var(--primary);">${title}</div>
    ${rows.map(([k,v])=>`<div style="display:flex; justify-content:space-between; gap:1rem; font-size:.86rem; padding:.3rem 0; border-bottom:1px dashed var(--border);"><span style="color:var(--muted);">${k}</span><span style="text-align:left;">${v}</span></div>`).join('')}
  </div>`;
}
function textField(label, path, val){
  return `<div><label class="field-label">${label}</label><input class="field-input" value="${val||''}" oninput="updateApply('${path}', this.value)"></div>`;
}
function textareaField(label, path, val){
  return `<div><label class="field-label">${label}</label><textarea class="field-input" rows="2" oninput="updateApply('${path}', this.value)">${val||''}</textarea></div>`;
}
function selectField(label, path, val, opts){
  return `<div><label class="field-label">${label}</label><select class="field-input" onchange="updateApply('${path}', this.value)">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
}
function fileField(label, path, val){
  return `<div><label class="field-label">${label}</label>
    <label class="btn btn-ghost btn-sm" style="width:100%; justify-content:center; cursor:pointer;">
      ${icon('doc')} ${val || 'ফাইল বেছে নিন (মক)'}
      <input type="file" style="display:none" onchange="mockFile('${path}', this.files[0])">
    </label></div>`;
}
function mockFile(path, file){ updateApply(path, file? file.name : ""); }

function getPath(obj, path){ return path.split('.').reduce((o,k)=>o&&o[k], obj); }
function setPath(obj, path, val){
  const keys = path.split('.'); let o=obj;
  for(let i=0;i<keys.length-1;i++) o = o[keys[i]];
  o[keys[keys.length-1]] = val;
}
function updateApply(path, val){ setPath(state.applyData, path, val); render(); }

function addProperty(){ state.applyData.properties.push({type:"আবাসিক",khatian:"",dag:"",holding:"",quantity:"",ownership:"একক মালিকানা",coOwners:[],docs:[]}); render(); }
function removeProperty(i){ state.applyData.properties.splice(i,1); render(); }
function addCoOwner(i){ state.applyData.properties[i].coOwners.push({name:"",phone:""}); render(); }
function removeCoOwner(i,j){ state.applyData.properties[i].coOwners.splice(j,1); render(); }
function addDoc(i){ state.applyData.properties[i].docs.push("দলিল_"+(state.applyData.properties[i].docs.length+1)+".pdf"); render(); }
function removeDoc(i,j){ state.applyData.properties[i].docs.splice(j,1); render(); }
function addNominee(){ state.applyData.nominees.push({name:"",relation:"",mobile:"",address:""}); render(); }
function removeNominee(i){ state.applyData.nominees.splice(i,1); render(); }

function applyNext(){
  if(state.applyStep===6){
    const cb = document.getElementById('confirmTruth');
    if(!cb || !cb.checked){ toast("আবেদন জমা দেওয়ার আগে তথ্যের সত্যতা নিশ্চিত করুন"); return; }
    submitApplication(); return;
  }
  if(state.applyStep===0 && (!state.applyData.name || !state.applyData.mobile || !state.applyData.nid)){
    toast("অনুগ্রহ করে চিহ্নিত (*) আবশ্যক ঘরগুলো পূরণ করুন"); return;
  }
  state.applyStep++; render(); window.scrollTo(0,0);
}
function applyBack(){ if(state.applyStep===0){ goHome(); return;} state.applyStep--; render(); window.scrollTo(0,0); }

let lastRefNo = "";
function submitApplication(){
  const d = state.applyData;
  const ref = nextRef(); lastRefNo = ref;
  const record = mkMember({
    refNo: ref, status:"PENDING", submittedAt:"২০২৬-০৯-১৭",
    name:d.name, fatherHusband:d.fatherHusband, motherName:d.motherName, dob:d.dob, nid:d.nid, mobile:d.mobile,
    email:d.email, gender:d.gender, occupation:d.occupation, photoName:d.photoName||"ছবি.jpg", signatureName:d.signatureName||"স্বাক্ষর.png",
    permanentAddress:d.permanentAddress, currentAddress: d.sameAsPermanent? "একই — স্থায়ী ঠিকানার অনুরূপ" : d.currentAddress,
    properties: JSON.parse(JSON.stringify(d.properties)), nominees: JSON.parse(JSON.stringify(d.nominees)),
    urgentContact: JSON.parse(JSON.stringify(d.urgentContact)), payment: JSON.parse(JSON.stringify(d.payment)),
  });
  state.members.unshift(record);
  state.applyStep = APPLY_STEPS.length; render(); window.scrollTo(0,0);
}
function applySuccessScreen(){

function openApprove(id){ if(!hasPermission(state.adminUser,'member.manage')) return; state.approveModal = id; render(); }

function confirmApprove(id){
  const m = state.members.find(x=>x.id===id);
  m.status="APPROVED"; m.memberId = nextMemberId();
  const uname = "member"+m.memberId.split('-')[2];
  m.credentials = {username:uname, mustChangePassword:true};
  m.reviewedBy = state.adminUser.name; m.reviewedAt = "২০২৬-০৯-১৭";
  m.installments = makeInstallments(-1);
  state.approveModal = null; toast(`${m.name} অনুমোদিত হয়েছেন — আইডি: ${m.memberId}`); render();
}
function confirmReject(id){
  const reason = document.getElementById('rejectReason').value.trim();
  if(!reason){ toast("প্রত্যাখ্যানের কারণ লিখুন"); return; }
  const m = state.members.find(x=>x.id===id);
  m.status="REJECTED"; m.rejectionReason=reason; m.reviewedBy=state.adminUser.name; m.reviewedAt="২০২৬-০৯-১৭";
  state.rejectModal = null; toast(`${m.name} এর আবেদন প্রত্যাখ্যান করা হয়েছে`); render();

          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}
function roleCard(role){
  const isSuper = role==="SUPER_ADMIN";
  return `<div class="surface elevated" style="border-radius:var(--radius-md); padding:1.2rem;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.9rem;">
      <div style="font-weight:700; font-size:1rem;">${roleLabel(role)}</div>
      ${isSuper? `<span class="badge badge-approved">সকল অনুমতি — সর্বদা</span>`:''}
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:.6rem .9rem;">
      ${PERMISSIONS.map(p=>{
        const reserved = p.key==="role.manage" && !isSuper;
        const on = isSuper || roleState[role].includes(p.key);
        return `<label style="display:flex; align-items:center; gap:.6rem; font-size:.86rem; ${reserved?'opacity:.5;':'cursor:pointer;'}" title="${p.desc}${reserved?' — শুধুমাত্র সুপার অ্যাডমিন':''}">
          <span class="switch-check ${on?'on':''}" onclick="${(isSuper||reserved)?'':`toggleRolePerm('${role}','${p.key}')`}"></span>
          ${p.label}
        </label>`;
      }).join('')}
    </div>
  </div>`;
}
function toggleRolePerm(role,key){
  const set = roleState[role];
  const idx = set.indexOf(key);
  if(idx>=0) set.splice(idx,1); else set.push(key);
  render();
}
function addOverride(){
  const email = document.getElementById('ovUser').value;
  const key = document.getElementById('ovKey').value;
  const action = document.getElementById('ovAction').value;
  overrides = overrides.filter(o=>!(o.adminEmail===email && o.key===key));
  overrides.push({adminEmail:email, key, granted: action==="grant"});
  const u = ADMIN_USERS.find(x=>x.email===email); const p = PERMISSIONS.find(x=>x.key===key);
  toast(`${u.name} এর জন্য "${p.label}" ${action==='grant'?'গ্রান্ট':'রিভোক'} করা হয়েছে`);
  render();
}
function clearOverrides(email){ overrides = overrides.filter(o=>o.adminEmail!==email); render(); }

/* ===================== MEMBER ===================== */
function viewMember(){
  const m = currentMember();
  return `
  <section class="admin-grid" style="display:grid; grid-template-columns:230px 1fr; gap:0; min-height:calc(100vh - 140px);">
    <aside style="border-left:1px solid var(--border); padding:1.5rem 1.1rem;">
      <div class="surface2" style="border-radius:var(--radius-md); padding:.9rem; margin-bottom:1.3rem; text-align:center;">
        <div style="width:3.2rem; height:3.2rem; border-radius:999px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto .6rem; font-weight:700; font-size:1.1rem;">${m.name.charAt(0)}</div>
        <div style="font-weight:700; font-size:.92rem;">${m.name}</div>
        <div style="font-size:.76rem; color:var(--muted);">${m.memberId}</div>
      </div>
      <nav style="display:flex; flex-direction:column; gap:.3rem;">
        <a class="nav-link ${state.memberSection==='dashboard'?'active':''}" href="javascript:void(0)" onclick="setMemberSection('dashboard')">${icon('home')} ড্যাশবোর্ড</a>
        <a class="nav-link ${state.memberSection==='profile'?'active':''}" href="javascript:void(0)" onclick="setMemberSection('profile')">${icon('user')} প্রোফাইল</a>
        <a class="nav-link ${state.memberSection==='installments'?'active':''}" href="javascript:void(0)" onclick="setMemberSection('installments')">${icon('coin')} চাঁদার ইতিহাস</a>
        <a class="nav-link ${state.memberSection==='password'?'active':''}" href="javascript:void(0)" onclick="setMemberSection('password')">${icon('lock')} পাসওয়ার্ড পরিবর্তন</a>
      </nav>
    </aside>
    <div style="padding:1.7rem 1.5rem;">
      ${state.memberSection==='dashboard'? memberDashboard(m) : state.memberSection==='profile'? memberProfile(m) : state.memberSection==='installments'? memberInstallments(m) : memberPassword(m)}
    </div>
  </section>`;
}
function setMemberSection(s){ state.memberSection=s; render(); }
function memberDashboard(m){
  const due = m.installments.filter(i=>i.status==='DUE').length;
  const paid = m.installments.length - due;
  return `
  <h2 class="font-display" style="font-size:1.35rem; margin:0 0 1.3rem;">স্বাগতম, ${m.name}</h2>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1.1rem; margin-bottom:1.5rem;">
    <div class="surface elevated" style="border-radius:var(--radius-md); padding:1.2rem;"><div style="font-size:.8rem; color:var(--muted);">সদস্য আইডি</div><div style="font-weight:700; font-size:1.15rem; margin-top:.35rem;">${m.memberId}</div></div>
    <div class="surface elevated" style="border-radius:var(--radius-md); padding:1.2rem;"><div style="font-size:.8rem; color:var(--muted);">পরিশোধিত মাস</div><div style="font-weight:700; font-size:1.15rem; margin-top:.35rem; color:var(--success);">${bn(paid)} / ${bn(m.installments.length)}</div></div>
    <div class="surface elevated" style="border-radius:var(--radius-md); padding:1.2rem;"><div style="font-size:.8rem; color:var(--muted);">বকেয়া মাস</div><div style="font-weight:700; font-size:1.15rem; margin-top:.35rem; color:${due?'var(--danger)':'var(--success)'};">${bn(due)}</div></div>
  </div>
  <div class="surface elevated" style="border-radius:var(--radius-md); padding:1.3rem;">
    <div style="font-weight:700; margin-bottom:.9rem;">সাম্প্রতিক চাঁদার অবস্থা</div>
    <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
      ${m.installments.slice(-6).map(i=>`<span class="badge ${i.status==='PAID'?'badge-paid':'badge-due'}">${MONTHS[i.month]}: ${i.status==='PAID'?'পরিশোধিত':'বকেয়া'}</span>`).join('')}
    </div>
  </div>`;
}
function memberProfile(m){
  return `
  <h2 class="font-display" style="font-size:1.35rem; margin:0 0 1.3rem;">প্রোফাইল</h2>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.1rem;">
    ${reviewBlock("ব্যক্তিগত তথ্য",[["নাম",m.name],["পিতা/স্বামী",m.fatherHusband],["মাতা",m.motherName],["জন্ম তারিখ",m.dob],["এনআইডি",m.nid],["মোবাইল",m.mobile],["পেশা",m.occupation||"—"]])}
    ${reviewBlock("ঠিকানা",[["স্থায়ী",m.permanentAddress],["বর্তমান",m.currentAddress]])}
  </div>
  <div style="margin-top:1.1rem;">
    <div style="font-weight:700; margin-bottom:.7rem;">সম্পত্তি</div>
    <div style="display:flex; flex-direction:column; gap:.75rem;">
      ${m.properties.map((p,i)=>`<div class="surface2" style="border-radius:var(--radius-md); padding:1rem; font-size:.86rem;">সম্পত্তি ${bn(i+1)} — ${p.type} · খতিয়ান ${p.khatian} · ${p.quantity}</div>`).join('')}
    </div>
  </div>`;
}
function memberInstallments(m){
  return `
  <h2 class="font-display" style="font-size:1.35rem; margin:0 0 1.3rem;">চাঁদার ইতিহাস — ২০২৬</h2>
  <div class="surface elevated" style="border-radius:var(--radius-md); overflow:hidden;">
    <table><thead><tr><th>মাস</th><th>পরিমাণ</th><th>অবস্থা</th><th>পরিশোধের তারিখ</th></tr></thead>
      <tbody>${m.installments.map(i=>`<tr><td>${MONTHS[i.month]}</td><td>৳ ${i.amount}</td><td>${i.status==='PAID'?'<span class="badge badge-paid">পরিশোধিত</span>':'<span class="badge badge-due">বকেয়া</span>'}</td><td>${i.paidAt||'—'}</td></tr>`).join('')}</tbody>
    </table>
  </div>
  <p style="color:var(--muted); font-size:.82rem; margin-top:.9rem;">চাঁদা পরিশোধ অফিসে সরাসরি (নগদ/বিকাশ/ব্যাংক) করা হয়; প্রশাসন তা এখানে হালনাগাদ করেন।</p>`;
}
function memberPassword(m){
  return `<h2 class="font-display" style="font-size:1.35rem; margin:0 0 1.3rem;">পাসওয়ার্ড পরিবর্তন</h2>
  <div class="surface elevated" style="border-radius:var(--radius-md); padding:1.5rem; max-width:26rem;">
    <label class="field-label">বর্তমান পাসওয়ার্ড</label><input type="password" class="field-input" style="margin-bottom:1rem;" placeholder="••••••••">
    <label class="field-label">নতুন পাসওয়ার্ড</label><input type="password" class="field-input" style="margin-bottom:1rem;" placeholder="••••••••">
    <label class="field-label">নতুন পাসওয়ার্ড নিশ্চিত করুন</label><input type="password" class="field-input" style="margin-bottom:1.2rem;" placeholder="••••••••">
    <button class="btn btn-primary" style="width:100%;" onclick="toast('পাসওয়ার্ড সফলভাবে পরিবর্তন হয়েছে')">পরিবর্তন সংরক্ষণ করুন</button>
  </div>`;
}

/* ===================== MODALS ===================== */
function modals(){
  let out = "";
  if(state.approveModal){
    const m = state.members.find(x=>x.id===state.approveModal);
    const previewId = `KAM-2026-${String(seq).padStart(4,'0')}`;
    out += `<div class="modal-backdrop" onclick="if(event.target===this){ state.approveModal=null; render(); }">
      <div class="surface modal-card" style="border-radius:var(--radius-lg); padding:1.7rem; max-width:26rem; width:100%; box-shadow:var(--shadow-lg);">
        <h3 class="font-display" style="font-size:1.18rem; margin:0 0 .65rem;">আবেদন অনুমোদন করুন</h3>
        <p style="font-size:.88rem; color:var(--ink-soft); margin:0 0 1.1rem;"><b>${m.name}</b> কে সদস্য হিসেবে অনুমোদন দিলে স্বয়ংক্রিয়ভাবে একটি সদস্য আইডি ও লগইন তথ্য তৈরি হবে।</p>
        <div class="surface2" style="border-radius:var(--radius-sm); padding:.85rem 1rem; margin-bottom:1.3rem; font-size:.86rem;">
          <div style="display:flex; justify-content:space-between;"><span style="color:var(--muted);">সদস্য আইডি</span><b>${previewId}</b></div>
          <div style="display:flex; justify-content:space-between; margin-top:.35rem;"><span style="color:var(--muted);">ব্যবহারকারী নাম</span><b>member${previewId.split('-')[2]}</b></div>
          <div style="display:flex; justify-content:space-between; margin-top:.35rem;"><span style="color:var(--muted);">প্রথম লগইনে</span><b>পাসওয়ার্ড পরিবর্তন আবশ্যক</b></div>
        </div>
        <div style="display:flex; gap:.6rem; justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" onclick="state.approveModal=null; render()">বাতিল</button>
          <button class="btn btn-primary btn-sm" onclick="confirmApprove('${m.id}')">নিশ্চিত করুন ও অনুমোদন করুন</button>
        </div>
      </div></div>`;
  }
  if(state.rejectModal){
    const m = state.members.find(x=>x.id===state.rejectModal);
    out += `<div class="modal-backdrop" onclick="if(event.target===this){ state.rejectModal=null; render(); }">
      <div class="surface modal-card" style="border-radius:var(--radius-lg); padding:1.7rem; max-width:26rem; width:100%; box-shadow:var(--shadow-lg);">
        <h3 class="font-display" style="font-size:1.18rem; margin:0 0 .65rem;">আবেদন প্রত্যাখ্যান করুন</h3>
        <p style="font-size:.88rem; color:var(--ink-soft); margin:0 0 .85rem;"><b>${m.name}</b> এর আবেদন প্রত্যাখ্যানের কারণ লিখুন। এটি আবেদনকারীকে জানানো হবে।</p>
        <textarea id="rejectReason" class="field-input" rows="4" placeholder="যেমন: প্রয়োজনীয় দলিল সংযুক্ত নেই..." style="margin-bottom:1.2rem;"></textarea>
        <div style="display:flex; gap:.6rem; justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" onclick="state.rejectModal=null; render()">বাতিল</button>
          <button class="btn btn-danger btn-sm" onclick="confirmReject('${m.id}')">প্রত্যাখ্যান নিশ্চিত করুন</button>
        </div>
      </div></div>`;
  }
  if(state.deleteConfirm){
    const m = state.members.find(x=>x.id===state.deleteConfirm);
    out += `<div class="modal-backdrop" onclick="if(event.target===this){ state.deleteConfirm=null; render(); }">
      <div class="surface modal-card" style="border-radius:var(--radius-lg); padding:1.7rem; max-width:24rem; width:100%; box-shadow:var(--shadow-lg);">
        <h3 class="font-display" style="font-size:1.12rem; margin:0 0 .65rem;">রেকর্ড মুছে ফেলুন?</h3>
        <p style="font-size:.87rem; color:var(--ink-soft); margin:0 0 1.2rem;"><b>${m.name}</b> এর সদস্য রেকর্ড স্থায়ীভাবে মুছে যাবে। এই কাজটি পূর্বাবস্থায় ফেরানো যাবে না।</p>
        <div style="display:flex; gap:.6rem; justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" onclick="state.deleteConfirm=null; render()">বাতিল</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('${m.id}')">মুছে ফেলুন</button>
        </div>
      </div></div>`;
  }
  if(state.forcePwModal){
    out += `<div class="modal-backdrop">
      <div class="surface modal-card" style="border-radius:var(--radius-lg); padding:1.7rem; max-width:24rem; width:100%; box-shadow:var(--shadow-lg);">
        <div style="width:2.7rem; height:2.7rem; border-radius:10px; background:var(--gold-soft); color:var(--gold-strong); display:flex; align-items:center; justify-content:center; margin-bottom:1rem;">${icon('lock')}</div>
        <h3 class="font-display" style="font-size:1.12rem; margin:0 0 .55rem;">প্রথম লগইন — পাসওয়ার্ড পরিবর্তন আবশ্যক</h3>
        <p style="font-size:.86rem; color:var(--ink-soft); margin:0 0 1.2rem;">নিরাপত্তার জন্য প্রথম লগইনে নতুন পাসওয়ার্ড সেট করুন।</p>
        <input type="password" class="field-input" placeholder="নতুন পাসওয়ার্ড" style="margin-bottom:.75rem;">
        <input type="password" class="field-input" placeholder="নতুন পাসওয়ার্ড নিশ্চিত করুন" style="margin-bottom:1.2rem;">
        <button class="btn btn-primary" style="width:100%;" onclick="state.forcePwModal=false; currentMember().credentials.mustChangePassword=false; toast('পাসওয়ার্ড সেট করা হয়েছে'); render()">পাসওয়ার্ড সেট করুন ও চালিয়ে যান</button>
      </div></div>`;
  }
  return out;
}

/* ===================== RENDER ===================== */
function render(){
  const app = document.getElementById('app');
  let inner;
  if(state.view==="home") inner = viewHome();
  else if(state.view==="login") inner = viewLogin();
  else if(state.view==="apply") inner = viewApply();
  else if(state.view==="admin") inner = viewAdmin();
  else if(state.view==="member") inner = viewMember();
  app.innerHTML = shell(inner);
}
render();
</script>
</body>
</html>
